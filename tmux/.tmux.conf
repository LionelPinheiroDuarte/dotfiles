# How long tmux waits after an Esc for the rest of a sequence. Not 0: the
# terminal's answers to vim's start-up queries (background colour, version)
# can arrive in pieces, and with no wait their tail reaches the pane as typed
# text, which vim runs as normal-mode commands (a note edited out of nowhere,
# then :q refusing to quit). 10 ms is tmux 3.5's default, still instant for a
# hand-typed Esc.
set -sg escape-time 10

# Mouse & scrollback
set -g mouse on
set -g history-limit 50000

# change default meta key to same as screen
unbind C-b
unbind C-a
set -g prefix C-a

# form vim/tmux d/y buffer sync
set -g focus-events

# use a different prefix for nested
bind-key -n -N "Send the prefix to a nested tmux" C-y send-prefix

# add double-tap meta key to toggle last window
bind-key -N "Last window" C-a last-window

# pane colors and display

# create more intuitive split key combos (same as modern screen)
unbind |
bind -N "Split side by side" | split-window -h
bind '\' split-window -h
bind 'C-\' split-window -h
unbind -
bind -N "Split top and bottom" - split-window -v
unbind _
bind _ split-window -v

# kill current window and all panes
bind-key -N "Kill the window and its panes (no confirm)" & kill-window

# vi for copy mode
setw -g mode-keys vi

# vi for command status
set -g status-keys vi

# vi keys to resize
bind -r -N "Resize the pane (vi direction)" C-h resize-pane -L 1
bind -r -N "Resize the pane (vi direction)" C-j resize-pane -D 1
bind -r -N "Resize the pane (vi direction)" C-k resize-pane -U 1
bind -r -N "Resize the pane (vi direction)" C-l resize-pane -R 1

# vi keys to navigate panes
bind -r -N "Select the pane (vi direction)" h select-pane -L
bind -r -N "Select the pane (vi direction)" j select-pane -D
bind -r -N "Select the pane (vi direction)" k select-pane -U
bind -r -N "Select the pane (vi direction)" l select-pane -R

#set -g status-left-style "fg=#928374"
#set -g status-left-style "fg=brightwhite"
#set -g status-left "#(head -1 ~/.status) "
#set -g status-right-length 50
#set -g status-right "#(pomo)" 
#set -g status-right-style "fg=#928374,bold"
#set -g window-status-format ""
#set -g window-status-current-format ""

set -g message-style "fg=red"

# avoid cursor movement messing with resize
set -g repeat-time 200

# colors, clock, and stuff
#set -g default-terminal "xterm-256color" # works, but oh so wrong
#set -ga terminal-overrides ",xterm-256color*:Tc"
set -g default-terminal "screen-256color"
#set -g clock-mode-style 12
setw -g clock-mode-colour cyan
set -g base-index 1
setw -g pane-base-index 1

# die, die, die (just be careful, right next to C-c)

# color the pane borders nearly invisible
# (when not using hacked tmux without them)
set -g pane-border-style "fg=#171717"
set -g pane-active-border-style "fg=#171717"

# color of the window selection background
set -g mode-style "bg=black"

# very unique Mac bug
if-shell "type 'reattach-to-user-namespace' >/dev/null" "set -g default-command 'reattach-to-user-namespace -l $SHELL'"

# reload configuration
bind -r -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf

# popup: files recently edited by Claude Code, open one in vim (toolbox's
# `x claude edits`)
# (e = all sessions, E = only under the current pane's directory)
# top aligned with the pane, so the tmux status line stays visible above it,
# and 80% high so Claude's prompt and footer stay visible below it
bind -N "Files Claude edited (all sessions)" e display-popup -E -w 90% -h 80% -y '#{popup_pane_top}' "~/.local/bin/x claude edits"
bind -N "Files Claude edited (under this pane)" E display-popup -E -w 90% -h 80% -y '#{popup_pane_top}' "~/.local/bin/x claude edits '#{pane_current_path}'"

# popup: one session per project with Claude in it (toolbox's `x claude
# projects`); pick one to jump there (created on the fly), ctrl-x closes one.
# `x claude projects restore` after a
# reboot reopens the saved ones, Claude resuming its last conversation.
bind -N "Claude projects: jump to one" g display-popup -E -w 80% -h 70% "~/.local/bin/x claude projects"
# popup: the journal (toolbox's `x notes --browse`); enter edits a note and
# comes back to the list, ctrl-o edits it in a new window, ctrl-n creates
# one, ctrl-x sends it to the trash. N, not n: n stays next-window.
bind -N "Journal notes" N display-popup -E -w 80% -h 70% "~/.local/bin/x notes --browse"
# popup: these shortcuts (toolbox's `x keys`), read from the -N notes in this
# file; a binding with no note (the \\ and _ aliases) stays out of the list.
# It replaces tmux's own ?, still there as `x keys --all` or prefix+/ <key>.
# No -E: the popup stays open once x keys is done, until Esc or C-c.
bind -N "These shortcuts" ? display-popup -w 70 -h 60% -T " shortcuts " "~/.local/bin/x keys"
# Claude's ✓ (answered) is cleared once you switch to its session
set-hook -g client-session-changed 'if -F "#{==:#{@claude_state},done}" "set -u @claude_state ; set -u @claude_state_at"'

set -g status-style "fg=#8b93a3"
set -g status-bg default
set -g status-position top
set -g status-interval 1
# Status line, left to right: the current session as a pill (◆, in
# @claude_accent: #f0a45d orange or #82aaff blue), its windows, then the other
# project sessions: ⟳ Claude working, ✓ Claude answered (the only thing in
# green, to catch the eye from another session), ● open. When Claude is
# neither working nor done anywhere else: "tout est calme". Right: the date
# (through date(1): the French locale writes "lun. 9 nov.", and tmux's own
# %a %b can't drop the dots) and pomo. The popups' keys are behind prefix+?.
# Commas inside #{...} branches are escaped as "#,".
set -g @claude_accent "#f0a45d"
set -g @status_windows '#{W:#[fg=#8b93a3]#I:#W  ,#[fg=#d6d9df#,bold]#I:#W#[nobold]  }'
set -g @status_others '#{?#{S:#{?#{&&:#{@claude_state},#{!=:#{session_name},#{client_session}}},1,}},#{S:#{?#{!=:#{session_name},#{client_session}},#{?#{==:#{@claude_state},running},#[fg=#f0a45d]⟳ #{session_name}  ,#{?#{==:#{@claude_state},done},#[bg=#8cc98f#,fg=#1b1d23#,bold] ✓ #{session_name} #[default]  ,#{?#{@claude_project},#[fg=#8b93a3]● #{session_name}  ,}}},}},#[fg=#8b93a3]tout est calme · #{server_sessions} session#{?#{==:#{server_sessions},1},,s}}'
set -g status-format[0] '#[bg=#{@claude_accent},fg=#1b1d23,bold] ◆ #S #[default]  #{E:@status_windows}#[fg=#5a6273]│  #{E:@status_others}#[align=right]#[fg=#8b93a3]#(date "+%%a %%-d %%b %%H:%%M" | tr -d .) #(pomo) '

