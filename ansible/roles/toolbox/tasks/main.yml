---
# ~/.local/bin is already on PATH via bash/.bashrc, so no `pipx ensurepath` needed.
# creates: skips the install once pipx has built the venv; a failed install leaves none.
- name: Install toolbox via pipx
  ansible.builtin.command:
    cmd: /usr/bin/pipx install "toolbox @ git+https://github.com/LionelPinheiroDuarte/toolbox.git"
    creates: "{{ ansible_env.HOME }}/.local/share/pipx/venvs/toolbox"
