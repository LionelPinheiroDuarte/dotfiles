---
# Python
- name: Install Python packages
  ansible.builtin.apt:
    name: "{{ apt_dev_packages }}"
    state: present

# Go — official binary tarball, reinstalled when go_version changes
- name: Check installed Go version
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go version
  register: go_installed
  changed_when: false
  failed_when: false

- name: Set Go install flag
  ansible.builtin.set_fact:
    go_needs_install: "{{ ('go' ~ go_version ~ ' ') not in (go_installed.stdout | default('')) }}"

- name: Download Go tarball
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: /tmp/go.tar.gz
    mode: "0644"
  when: go_needs_install

# Extracting over an old tree leaves stale files behind — Go's docs say remove first.
- name: Remove previous Go install
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when: go_needs_install

- name: Extract Go to /usr/local
  ansible.builtin.unarchive:
    src: /tmp/go.tar.gz
    dest: /usr/local
    remote_src: true
  when: go_needs_install

- name: Add Go to PATH via profile.d
  ansible.builtin.copy:
    dest: /etc/profile.d/go.sh
    content: "export PATH=$PATH:/usr/local/go/bin\n"
    mode: "0644"

# Node.js — NodeSource official apt repo
- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# VHS — Charm official apt repo
- name: Download Charm GPG key
  ansible.builtin.get_url:
    url: https://repo.charm.sh/apt/gpg.key
    dest: /etc/apt/keyrings/charm.asc
    mode: "0644"

- name: Add Charm apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/charm.asc] https://repo.charm.sh/apt/ * *"
    state: present
    filename: charm

- name: Install VHS
  ansible.builtin.apt:
    name: vhs
    state: present
    update_cache: true

# pip — user-level Python tools. The play runs with become: true, so opt out here;
# otherwise --user installs into root's ~/.local.
- name: Install pip packages
  become: false
  ansible.builtin.pip:
    name: "{{ pip_packages }}"
    extra_args: --user --break-system-packages

# npm global packages — `npm ls -g` exits non-zero when the package is missing.
# check_mode: false so the probe also runs under --check.
- name: Check global npm packages
  ansible.builtin.command:
    cmd: npm ls -g --depth=0 {{ item }}
  loop: "{{ npm_global_packages }}"
  register: npm_ls
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install missing global npm packages
  ansible.builtin.command:
    cmd: npm install -g {{ item.item }}
  loop: "{{ npm_ls.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

# GitHub CLI — official apt repo
- name: Download GitHub CLI GPG key (binary keyring, keeps .gpg)
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    state: present
    filename: github-cli

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
