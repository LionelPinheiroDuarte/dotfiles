---
# Same fallback as bash/.bashrc: keep using ~/repos on machines not migrated to ~/Repos,
# instead of cloning a second copy and repointing the symlinks at it.
- name: Check for a legacy lowercase repos directory
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/repos/github"
  register: legacy_github_dir

- name: Fall back to ~/repos/github when ~/Repos/github is missing
  ansible.builtin.set_fact:
    github_dir: "{{ legacy_github_dir.stat.path }}"
  when:
    - legacy_github_dir.stat.isdir | default(false)
    - github_dir is not exists

- name: Create repos directory
  ansible.builtin.file:
    path: "{{ github_dir }}"
    state: directory
    mode: "0755"

# ~/Documents usually ships with the OS — only created when missing, never re-moded.
- name: Ensure ~/Documents exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Documents"
    state: directory

- name: Check if dotfiles directory exists
  ansible.builtin.stat:
    path: "{{ github_dir }}/dotfiles"
  register: dotfiles_dir

- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: https://github.com/LionelPinheiroDuarte/dotfiles.git
    dest: "{{ github_dir }}/dotfiles"
    update: false
  when: not dotfiles_dir.stat.exists

# agents ships the framework scripts (claude-usage, proj-*) symlinked below.
- name: Clone agents repository
  ansible.builtin.git:
    repo: https://github.com/LionelPinheiroDuarte/agents.git
    dest: "{{ github_dir }}/agents"
    update: false

# ~/.claude must exist before we can symlink settings.json into it.
- name: Ensure ~/.claude exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0755"

- name: Symlink dotfiles to $HOME
  ansible.builtin.file:
    src: "{{ github_dir }}/dotfiles/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "bash/.bashrc",  dest: ".bashrc" }
    - { src: "vim/.vimrc",    dest: ".vimrc" }
    - { src: "vim/.vim",      dest: ".vim" }
    - { src: "tmux/.tmux.conf", dest: ".tmux.conf" }
    - { src: ".gitconfig",    dest: ".gitconfig" }
    - { src: ".claude/settings.json", dest: ".claude/settings.json" }

# ~/.local/bin must exist and be on PATH before we can symlink scripts into it.
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: Symlink scripts into ~/.local/bin
  ansible.builtin.file:
    src: "{{ github_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "dotfiles/scripts/home",         dest: "home" }
    - { src: "dotfiles/scripts/ghrepos",      dest: "ghrepos" }
    - { src: "dotfiles/scripts/setup",        dest: "setup" }
    - { src: "dotfiles/scripts/claude-edits", dest: "claude-edits" }
    - { src: "dotfiles/scripts/claude-projects", dest: "claude-projects" }
    - { src: "agents/framework/scripts/claude-usage.py", dest: "claude-usage" }
    - { src: "agents/framework/scripts/proj-status",     dest: "proj-status" }
    - { src: "agents/framework/scripts/proj-check",      dest: "proj-check" }
